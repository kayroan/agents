[project]
name = "pokemon_researcher"
version = "0.1.0"
description = "pokemon_researcher using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]==1.7.2"
]

[project.scripts]
pokemon_researcher = "pokemon_researcher.main:run"
run_crew = "pokemon_researcher.main:run"
train = "pokemon_researcher.main:train"
replay = "pokemon_researcher.main:replay"
test = "pokemon_researcher.main:test"
run_with_trigger = "pokemon_researcher.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
